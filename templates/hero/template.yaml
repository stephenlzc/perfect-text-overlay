name: "hero"
scene_type: "banner"
canvas_width: 1600
canvas_height: 900
base_image_prompt: "modern wide developer-tool banner illustration with sleek wireless headphones floating over a clean deep indigo-to-teal gradient, subtle geometric grid and soft light beams, generous empty space on the left half, flat modern tech aesthetic with a soft 3D product render, no text, no letters, no watermark, no logos"
safe_zones:
  - name: "left_text_zone"
    x: 80
    y: 120
    width: 700
    height: 470
text_layers:
  - name: "brand"
    type: "text"
    default_font: "Roboto-Bold.ttf"
    fallback_fonts:
      - "NotoSansCJKsc-Bold.otf"
      - "NotoSansCJKkr-Bold.otf"
      - "NotoSansCJKtc-Bold.otf"
      - "OpenSans-Bold.ttf"
    max_width: 680
    max_lines: 1
    effects:
      - "shadow"
      - "outline"
    anchor: "top-left"
    x: 100
    y: 150
    color: "#67E8F9"
    stroke_color: "#172554"
    stroke_width: 2
    font_size: 110
    rtl_flip: false

  - name: "tagline"
    type: "text"
    default_font: "Roboto-Bold.ttf"
    fallback_fonts:
      - "NotoSansCJKsc-Bold.otf"
      - "NotoSansCJKkr-Bold.otf"
      - "NotoSansCJKtc-Bold.otf"
      - "OpenSans-Bold.ttf"
    max_width: 680
    max_lines: 2
    effects:
      - "shadow"
    anchor: "top-left"
    x: 100
    y: 295
    color: "#F8FAFC"
    stroke_color: "#0F172A"
    stroke_width: 1
    font_size: 44
    rtl_flip: false

  - name: "badge"
    type: "badge"
    default_font: "Roboto-Bold.ttf"
    fallback_fonts:
      - "NotoSansCJKsc-Bold.otf"
      - "NotoSansCJKkr-Bold.otf"
      - "NotoSansCJKtc-Bold.otf"
      - "OpenSans-Bold.ttf"
    max_width: 590
    max_lines: 1
    effects:
      - "backdrop"
      - "shadow"
    anchor: "top-left"
    x: 100
    y: 440
    color: "#E0F2FE"
    backdrop_color: "auto-dark"
    padding: 18
    stroke_color: "#0F172A"
    stroke_width: 0
    font_size: 30
    rtl_flip: false

translations_file: "translations/en.json"
output_format: "png"
output_quality: 95
