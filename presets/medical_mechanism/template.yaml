name: "medical_mechanism"
scene_type: "medical"
canvas_width: 1600
canvas_height: 2000

base_image_prompt: |
  Detailed scientific textbook illustration of a mitochondrion cross-section
  inside a cell, showing the double membrane with folded cristae, glowing
  golden energy particles and soft light beams flowing along the inner
  membrane suggesting electron flow, a curved pathway of four softly glowing
  circular nodes flowing down the right side, gentle blue cytoplasm
  background with faint surrounding organelles, clean educational
  biochemistry diagram style, generous empty space on the left side for
  labels and at the top for a title, no text, no letters, no numbers,
  no labels, no watermark.

safe_zones:
  - name: "title_zone"
    x: 100
    y: 80
    width: 1400
    height: 280
  - name: "stages_zone"
    x: 60
    y: 380
    width: 720
    height: 1440
  - name: "caption_zone"
    x: 100
    y: 1830
    width: 1400
    height: 140

text_layers:
  - name: "title"
    type: "text"
    default_font: "Roboto-Bold.ttf"
    fallback_fonts:
      - "NotoSansCJKsc-Bold.otf"
      - "NotoSansCJKtc-Bold.otf"
      - "NotoSansCJKkr-Bold.otf"
      - "NotoSansArabic-Bold.ttf"
    max_width: 1400
    max_lines: 2
    effects:
      - "shadow"
    anchor: "top-center"
    x: 800
    y: 170
    color: "#0B3C5D"
    font_size: 84

  - name: "subtitle"
    type: "text"
    default_font: "Roboto-Bold.ttf"
    fallback_fonts:
      - "NotoSansCJKsc-Bold.otf"
      - "NotoSansCJKtc-Bold.otf"
      - "NotoSansCJKkr-Bold.otf"
      - "NotoSansArabic-Bold.ttf"
